[project]
name = "fast-api-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.27.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[project.scripts]
fast-api-learn = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.targets.wheel.force-include]
"src/main.py" = "main.py"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
